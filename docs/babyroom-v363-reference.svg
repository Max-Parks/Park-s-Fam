<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1450" viewBox="0 0 1120 1450" role="img" aria-labelledby="title desc">
  <title id="title">아기방 V3.63 기본 치수 검토도</title>
  <desc id="desc">현재 앱 기본값 2700×3590 밀리미터. 우상단 440×310, 우하단 550×85 꺾임은 실측이 필요한 초기값. 출입문은 기존 사용자 실측 기록 65+800+65=930, 힌지축 65, 회전 반경 800. 가구 배치와 전체 집 연결은 포함하지 않는다.</desc>

name: Build Ttobok Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            echo "ANDROID_HOME=$ANDROID_HOME"
            find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -20 || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Android project
        shell: bash
        run: |
          rm -rf android-apk
          mkdir -p android-apk/app/src/main/res/values
          mkdir -p android-apk/app/src/main/res/drawable

          cat > android-apk/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > android-apk/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TtobokHome"
          include(":app")
          EOF

          cat > android-apk/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.10.1' apply false
          }
          EOF

          cat > android-apk/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.maxparks.ttobokhome'
              compileSdk 36
          
              defaultConfig {
                  applicationId 'com.maxparks.ttobokhome'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
          
              signingConfigs {
                  release {
                      storeFile file('../ttobok-release.p12')
                      storePassword System.getenv('TTOBOK_KEYSTORE_PASSWORD')
                      keyAlias 'ttobok'
                      keyPassword System.getenv('TTOBOK_KEYSTORE_PASSWORD')
                  }
              }
          
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
          }
          EOF

          cat > android-apk/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
          
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar"
                  android:usesCleartextTraffic="false">
          
                  <meta-data
                      android:name="asset_statements"
                      android:resource="@string/asset_statements" />
          
                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true"
                      android:label="@string/app_name">
          
                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="@string/launch_url" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.FALLBACK_STRATEGY"
                          android:value="customtabs" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.DISPLAY_MODE"
                          android:value="standalone" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.SCREEN_ORIENTATION"
                          android:value="any" />
          
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-apk/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">또복이 집도면</string>
              <string name="launch_url">https://max-parks.github.io/Park-s-Fam/</string>
              <string name="asset_statements">[{&quot;relation&quot;:[&quot;delegate_permission/common.handle_all_urls&quot;],&quot;target&quot;:{&quot;namespace&quot;:&quot;web&quot;,&quot;site&quot;:&quot;https://max-parks.github.io&quot;}}]</string>
          </resources>
          EOF

          echo '' | base64 --decode > android-apk/app/src/main/res/drawable/app_icon.png

      - name: Restore private signing key
        env:
          TTOBOK_SIGNING_BUNDLE: ${{ secrets.TTOBOK_SIGNING_BUNDLE }}
        shell: bash
        run: |
          if [ -z "$TTOBOK_SIGNING_BUNDLE" ]; then
            echo "Repository secret TTOBOK_SIGNING_BUNDLE is missing."
            exit 1
          fi
          PASS="${TTOBOK_SIGNING_BUNDLE%%|*}"
          KEY_B64="${TTOBOK_SIGNING_BUNDLE#*|}"
          echo "::add-mask::$PASS"
          echo "$KEY_B64" | base64 --decode > android-apk/ttobok-release.p12
          echo "TTOBOK_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle -p android-apk :app:assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          cp android-apk/app/build/outputs/apk/release/app-release.apk ttobok-home.apk
          ls -lh ttobok-home.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttobok-home-apk
          path: ttobok-home.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Pages repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ttobok-home.apk
          if git diff --cached --quiet; then
            echo "APK unchanged."
            exit 0
          fi
          git commit -m "Build Android APK"
          git push

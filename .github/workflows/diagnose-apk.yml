name: Diagnose existing Android APK

on:
  workflow_dispatch:
  push:
    branches: ['codex/v364-app-ui-review']
    paths:
      - '.github/workflows/diagnose-apk.yml'
      - 'scripts/diagnose_apk.py'
      - 'ttobok-home.apk'

permissions:
  contents: read

jobs:
  existing-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch the existing APK and capture native diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: python3 scripts/diagnose_apk.py --require-twa
      - name: Save launch logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-launch-diagnostics-api35
          path: apk-diagnostics/
          if-no-files-found: warn
          retention-days: 14
